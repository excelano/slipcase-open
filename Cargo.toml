[package]
name = "slipcase-open"
description = "Open the payload of a Slipcase container in its own application, and write edits back into the container"
version = "0.1.4"
edition = "2021"
authors = ["David M. Anderson"]
license = "MIT"
repository = "https://github.com/excelano/slipcase-open"
readme = "README.md"
keywords = ["slipcase", "container", "gui", "egui"]
categories = ["gui", "filesystem"]
# Published since 2026-09-07, which reversed a decision recorded here on
# 2026-09-01 and worth keeping the shape of. What this tool is for is the
# double-click: the desktop entry, the media type `slipcase-common` declares,
# and the policy file under `/etc`. A crate carries none of those, so
# `cargo install slipcase-open` hands somebody concept 9's command-line floor
# with no association above it, and the symptom of the missing media type is
# the one `packaging/linux/install.sh` warns about: a double-clicked container
# opens the archive tool. The channels in PLAN.md 15 carry the rest of it and
# remain the way a person should install this. crates.io is the from-source
# route for somebody who already has a toolchain, and README.md says what it
# leaves out.
#
# One thing about the published crate is quietly broken, measured 2026-09-01
# and unchanged: `cargo publish` strips the `testsupport` dev-dependency below,
# a git dependency carrying no version, while still shipping the two unit tests
# that call it, in `extract.rs` and `writeback.rs`. The verify step compiles
# the library and the binary and not the tests, so it reports success, and
# `cargo test` on the extracted crate then fails with two unresolved-crate
# errors. `cargo install` never builds tests and a downstream dependency never
# builds dev-dependencies, so nobody installing meets it; anyone running the
# suite runs it from this checkout.
# `slpc`'s floor, which is `zip`'s floor, which is a number nobody here chose.
# It moves when that one does.
rust-version = "1.88"

[dependencies]
# From crates.io as of 0.3.11, which is the release carrying `payload_crc`.
# It was a path dependency until then (PLAN.md Phase 0), and switching off it is
# what finally exercises `slpc` as a published crate — an argument nothing in
# that workspace can make on its own, because its own CLI reaches the library by
# path. `fs` is the atomic file placement write-back needs and `provenance` is
# the mark carried onto the replacement; `fs` implies the second, and both are
# named because this crate uses both directly.
slpc = { version = "0.3.11", features = ["fs", "provenance"] }
# The session record. Already in the tree under `slpc`, which parses the
# metadata member with it, so this costs a line rather than a dependency — and
# a payload name may carry a quote or a backslash, which is where hand-rolling
# the writing side goes wrong.
toml_edit = "0.25"
# Watching the payload directory. Concept 6 needs the watch on the directory
# rather than the file, because a serious editor saves by writing a temporary
# sibling and renaming over the target, and a watcher holding the file loses its
# handle on the first save. `notify` does that on all three platforms —
# ReadDirectoryChangesW, FSEvents, inotify — but only if set up that way
# deliberately.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# Recovery compares the extracted payload against the CRC-32 the container
# already records for it (concept 6.3). Already compiled in the tree under
# `zip`, so this is a manifest line rather than a dependency. It answers whether
# a file changed and never whether it can be proved untampered — SPEC 5 defines
# no fixity key and this is not one.
crc32fast = "1.5"
# The verbs. Concept 9 keeps the command line as the floor beneath the
# notifications and the tray, so this is a shipped interface and not only the
# harness the engine is driven by.
clap = { version = "4.6", features = ["derive"] }

# Linux's half of concept 9. `org.freedesktop.Notifications` has carried an
# actions parameter for as long as it has existed, and a notification with
# buttons is the portable primitive the design needs — so this is a D-Bus client
# and not a notification library. Pure Rust, which keeps `forbid(unsafe_code)`
# honest for the crate and does not put libdbus in the link line of a `.deb`.
#
# `notify-send` was the alternative and is the wrong shape rather than
# incapable: recent libnotify can pass `--action` and print the key that was
# pressed, but it does so by blocking one process per notification, and it
# offers no way to withdraw one or to hold several questions at once. It is also
# not guaranteed to be installed, where the bus interface is what a desktop
# provides.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Windows' half of concept 8's file identity: one function,
# `GetFileInformationByHandle`, for the volume serial number and file index that
# keep two hard links to one container from opening two sessions on it.
#
# Already compiled for this target under `clap`, `tempfile` and `notify`, so
# this is a manifest line rather than a dependency — `cargo tree -i
# windows-sys@0.61.2` names all three, and `Cargo.lock` gained one edge and no
# package.
#
# `same-file` was the other route PLAN.md named, and it does not fit. It keys on
# exactly this pair and compares on it, but `key` and its `Key` type are both
# private with no accessor, and a `Handle` holds the file open for as long as it
# lives — where `Identity` is owned data held across a whole session and
# printed. Measured by reading `same-file-1.0.6/src/win.rs` rather than inferred
# from its documentation. Not a question of weight: `walkdir` puts `same-file`
# in the tree already, so taking that route would have cost a line too. It is
# the shape that is wrong.
#
# `windows-sys` and not `windows`, because this is plain Win32 with no COM in
# it. The launcher's `IAttachmentExecute` is COM and is a decision for the arm
# that has to make that call; if it takes the `windows` crate, this line
# collapses into that one.
# The launcher's half, and the reason there are two of these. `ShellExecuteEx`
# is plain Win32, but the arm was written against `IAttachmentExecute` first and
# COM is what `windows-sys` does not do: it binds functions and structures and
# leaves interfaces alone, so reaching one means writing its vtable by hand. The
# measurement in `platform::shell` ended with `IAttachmentExecute` not being
# used, which weakens that reason without retiring it, because concept 9's toast
# is WinRT and lands here too. So the split is COM and WinRT through `windows`,
# plain Win32 through `windows-sys`, and neither is the other's fallback.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    # `Storage` is here for one call: asking Windows where this package keeps
    # its data instead of asking for `%LOCALAPPDATA%` and being handed a
    # redirected view of it without being told. `session::platform_base` has
    # the measurement, and the defect it closes.
    "Storage",
    # And `Storage_Search`, which is not about searching. `LocalCacheFolder` is
    # declared on `IApplicationData2` and the bindings gate that whole interface
    # behind this feature, so it is the price of the one accessor rather than a
    # capability being asked for. The cache and not `LocalFolder` because it is
    # the store Windows neither roams nor puts in a device backup, which is what
    # a copy of somebody's payload should be.
    "Storage_Search",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# Concept 10's Windows layers, which are registry keys. Reading them by hand
# means `RegOpenKeyEx` and `RegQueryValueEx` with their two-call buffer sizing
# and a `REG_MULTI_SZ` to walk, which is perhaps a hundred lines this crate
# would have to hold `unsafe` for — to read six values. This is the same
# vendor's safe wrapper over exactly those calls, so the level stays where
# `identity.rs` and `platform.rs` put it: lifted only where something is being
# done that no safe API covers.
#
# It costs one crate and no duplicate: `cargo tree -i windows-result` shows
# 0.6.1 and `windows-core` 0.62.2 sharing `windows-result` 0.4.1, so the lock
# gained an edge rather than a second copy of the Windows crates — which is the
# thing the note above about `windows-sys` was written to watch for. Measured
# 2026-09-05. A later version of this crate is published and is not taken,
# because that one is what pulls a second copy in.
windows-registry = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # One call, `GetCurrentPackageFamilyName`, asked only whether it answers at
    # all. `session::packaged` says why the question has to be put in Win32
    # rather than to the WinRT call it guards.
    "Win32_Storage_Packaging_Appx",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# A root of its own per test, so the suite never touches the real state
# directory and two tests never share one.
tempfile = "3.27"
# Marking a file the way a platform's downloader marks one. Taken from
# `slpc-rust` rather than written again: that crate exists because two copies of
# this helper disagreed about the Windows arm within an hour of being written,
# and a third here would undo that on purpose. `publish = false` and no version,
# so a git dependency is the route from outside that workspace. PLAN.md.
testsupport = { git = "https://github.com/excelano/slpc-rust" }
# One test builds a container the writer will not produce: a payload with
# general purpose bit 0 set, which is what `check_payload_readable` refuses.
# Already in the tree under `slpc`.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
# The engine reads containers and replaces files. Nothing here needs to reach
# past the borrow checker to do it, and of the two modules that will — the
# Windows and macOS platform arms — the first is written and the second is not.
# `slipcase-desktop` DESIGN 3
# records why this is `forbid` in a library root and `deny` where a platform
# eventually has to lift it. Windows is the first platform to, for
# `GetFileInformationByHandle` in `identity.rs`.
#
# `deny` rather than `forbid`, and the two are not interchangeable here: an
# inner `allow` cannot override a `forbid`, which is the entire point of the
# stronger level. Measured 2026-09-01: `[target.'cfg(windows)'.lints]` is not a
# table cargo reads — it answers `warning: unused manifest key` and applies
# nothing at all — so this key cannot be narrowed to one platform from here.
# What narrows it is the `cfg_attr` in each of the three crate roots, which puts
# `forbid` back everywhere Windows is not. Linux and macOS keep exactly the
# level they have always had, and the relaxation reaches one module.
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

# The package the Excelano apt repository ships. Concept 15: `cargo-deb` and
# that repository are the established path in `slpc-rust`, and a `.deb` is what
# carries the desktop entry, the media type, and the root-owned policy file
# concept 10 wants.
[package.metadata.deb]
maintainer = "David M. Anderson <david.anderson@excelano.com>"
# One line per sentence: cargo-deb re-wraps this, and a source line broken
# mid-sentence comes out broken in `apt show`.
extended-description = """
slipcase-open opens the payload of a .slpc container in whatever application normally handles that kind of file, watches for edits, and writes them back into the container.
Double-click a container and the document opens; save it and the container is repacked around it. No metadata window, no preview, no container browsing — the companion viewer is what those are for."""
section = "utils"
priority = "optional"
# `slipcase-common` declares the media type and ships the icon a container is
# drawn with. It is a hard dependency and not a recommendation: without the
# type declared, nothing associates a `.slpc` with the desktop entry below and
# double-clicking one does nothing this package would recognise. It pulls
# `shared-mime-info` in behind it, which is why that is not named here.
depends = "libc6, libgcc-s1, slipcase-common, desktop-file-utils"
license-file = ["LICENSE", "0"]
# Debian policy makes this an error rather than a warning, and lintian agrees:
# somebody installing from an apt repository has no other way to see what
# changed between two versions. cargo-deb compresses it into
# `changelog.Debian.gz` and finds it nowhere by default — neither `./changelog`
# nor `debian/changelog` is looked at without this key, which is measured.
changelog = "debian/changelog"

# Naming any asset means naming all of them, the binary included. The
# `target/release` prefix is the one path here that is not literal: cargo-deb
# rewrites it to wherever the target directory actually is, which matters on
# every machine in this fleet, since `[build] target-dir` moves it and no
# environment variable then says so. `dpkg-deb -c` on the result is what
# confirms it landed.
#
# No maintainer scripts. `desktop-file-utils` owns the dpkg trigger on the
# directory written into here, so the desktop cache is rebuilt without a
# `postinst` asking. That is why it is in `depends` as much as for anything it
# provides at run time.
#
# `/etc/slipcase/open.toml` becomes a conffile by virtue of its path, so dpkg
# keeps an administrator's edits across an upgrade and asks before replacing
# them. That is the behaviour concept 10 needs and the reason the file is under
# `/etc` rather than somewhere this package would overwrite.
assets = [
    ["target/release/slipcase-open", "usr/bin/", "755"],
    ["packaging/linux/slipcase-open.desktop", "usr/share/applications/", "644"],
    ["packaging/linux/open.toml", "etc/slipcase/open.toml", "644"],
    # cargo-deb compresses anything under `man` on its way in, so this is
    # listed uncompressed and arrives as `.1.gz`. lintian makes its absence a
    # warning and CI fails on warnings, which is the right weight for it:
    # concept 9 keeps the command line a shipped interface rather than a test
    # harness, and a shipped interface with no manual page is half a promise.
    ["packaging/man/slipcase-open.1", "usr/share/man/man1/", "644"],
    ["README.md", "usr/share/doc/slipcase-open/README.md", "644"],
]
