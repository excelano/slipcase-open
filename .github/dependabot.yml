version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # **`windows-registry` is held at the 0.6 line, and the reason is a claim in
    # `Cargo.toml` rather than anything broken.** The comment above that
    # dependency measures what taking it cost — `windows-registry` 0.6.1 and
    # `windows-core` 0.62.2 share `windows-result` 0.4.1, so the lockfile gained
    # an edge and not a second copy of the Windows crates — and cheapness was
    # the whole argument for taking it. 0.100.0 is windows-rs re-basing its
    # support crates onto a new line rather than an ordinary step: the lockfile
    # gains `windows-result`, `windows-link` and `windows-strings` at 0.100.0
    # while the 0.4.1, 0.2.1 and 0.5.1 that `windows` 0.62 pulls all stay, so
    # both generations compile. `potext` asks for the 0.6 line as well, so
    # `windows-registry` itself ends up in the tree twice on top of that.
    # Windows CI is green on the bump, so this is not about the API; it is about
    # not quadrupling the cost of a dependency taken because it cost one crate,
    # for no fix and no feature anything here needs.
    #
    # **Lift it when `windows` and `potext` are both on the 0.100 line**, which
    # is the day the cheapness argument comes back and this rule stops being
    # true. `>= 0.7` rather than an update-type, because Dependabot reads 0.6 to
    # 0.100 as a *minor* step — both majors are zero — so an ignore on major
    # updates would not have caught it and would have looked like it did.
    ignore:
      - dependency-name: "windows-registry"
        versions: [">= 0.7"]
    groups:
      cargo:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
