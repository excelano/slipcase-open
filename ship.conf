# Values ship reads. Format and keys: anderix/ship, docs/DESIGN.md.
targets=apt crates msix cask
apt_package=slipcase-open
crates=slipcase-open
# The repository, which is what Homebrew's excelano/tap resolves to; the cask
# in it is slipcase-open. Required because cask is a target.
tap=excelano/homebrew-tap
store_locales=en-us de-de
display_name=Slipcase Open
